# 部署：拉 GHCR 已发布镜像运行；本地构建镜像用 mise run image-server / mise run image-admin，不归 compose 管。
# 只监听 127.0.0.1，对外访问由宿主 nginx / cloudflared 反代到这个端口。
services:
  server:
    image: ghcr.io/mintpopai/lane-server:${SERVER_TAG:-latest}
    container_name: lane-server
    restart: unless-stopped
    ports:
      # 宿主 IP 钉死 127.0.0.1，宿主端口参数化，容器端口固定
      - "127.0.0.1:${SERVER_PORT:-8081}:8080"
    environment:
      # 仅影响容器日志时间戳；业务时间全链路 UTC 存取，与本变量无关
      TZ: ${TZ:-UTC}
    volumes:
      # 服务端全部配置（外置 MySQL 连接、加密与会话密钥、Logto 凭据）都在这一个文件里，
      # 参照 apps/server/config/application.example.yml 填写；只读挂载，不进镜像
      - ./application.yml:/app/config/application.yml:ro
    healthcheck:
      # 这里的 127.0.0.1 是容器内部探活自己，与上面宿主侧的监听地址是两回事
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  website:
    image: ghcr.io/mintpopai/lane-website:${WEBSITE_TAG:-latest}
    container_name: lane-website
    restart: unless-stopped
    ports:
      # 宿主 IP 钉死 127.0.0.1，宿主端口参数化，容器端口固定
      - "127.0.0.1:${WEBSITE_PORT:-8083}:80"
    healthcheck:
      # 这里的 127.0.0.1 是容器内部探活自己，与上面宿主侧的监听地址是两回事
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  admin:
    image: ghcr.io/mintpopai/lane-admin:${ADMIN_TAG:-latest}
    container_name: lane-admin
    restart: unless-stopped
    ports:
      # 宿主 IP 钉死 127.0.0.1，宿主端口参数化，容器端口固定
      - "127.0.0.1:${ADMIN_PORT:-8082}:80"
    healthcheck:
      # 这里的 127.0.0.1 是容器内部探活自己，与上面宿主侧的监听地址是两回事
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

# 部署：拉 GHCR 已发布镜像运行；本地构建镜像用 mise run image-server / mise run image-admin，不归 compose 管。
# 对外入口是宿主机上已有的 OpenResty（按 Host 分流到下面各站点端口），compose 内不再另设网关；
# 前端端口一律绑 127.0.0.1，只对本机可见——绑 0.0.0.0 会让容器直接对公网可达，绕过
# OpenResty 与 Cloudflare。server 不映射宿主端口，只经容器网络被 admin 与 website 反代访问
# （/api、/auth、/oauth2；桌面端 app 走官网主站域名）。
# 依赖 Compose ≥ 2.17（depends_on 的 restart 字段）：升级 server 时两个前端自动重启以重新解析
# nginx 上游 IP（proxy_pass 用主机名且未配 resolver，会在配置加载时永久缓存旧 IP，否则升级后 502）
services:
  server:
    image: ghcr.io/mintpopai/mintpop-lane/server:${SERVER_TAG:-latest}
    container_name: mintpop-lane-server
    restart: unless-stopped
    environment:
      # 仅影响容器日志时间戳；业务时间全链路 UTC 存取，与本变量无关
      TZ: ${TZ:-UTC}
    volumes:
      # 服务端全部配置（外置 MySQL 连接、加密与会话密钥、Logto 凭据）都在这一个文件里，
      # 参照 apps/server/config/application.example.yml 填写；只读挂载，不进镜像
      - ./application.yml:/app/config/application.yml:ro
    healthcheck:
      # 这里的 127.0.0.1 是容器内部探活自己，与上面宿主侧的监听地址是两回事；
      # 探活用 curl——运行镜像是 eclipse-temurin JRE 底座，装的是 curl、没有 wget
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  website:
    image: ghcr.io/mintpopai/mintpop-lane/website:${WEBSITE_TAG:-latest}
    container_name: mintpop-lane-website
    restart: unless-stopped
    ports:
      # 宿主 IP 钉死 127.0.0.1，宿主端口参数化，容器端口固定
      - "127.0.0.1:${WEBSITE_PORT:-8083}:80"
    depends_on:
      server:
        condition: service_healthy
        restart: true
    healthcheck:
      # 这里的 127.0.0.1 是容器内部探活自己，与上面宿主侧的监听地址是两回事
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  admin:
    image: ghcr.io/mintpopai/mintpop-lane/admin:${ADMIN_TAG:-latest}
    container_name: mintpop-lane-admin
    restart: unless-stopped
    ports:
      # 宿主 IP 钉死 127.0.0.1，宿主端口参数化，容器端口固定
      - "127.0.0.1:${ADMIN_PORT:-8082}:80"
    depends_on:
      server:
        condition: service_healthy
        restart: true
    healthcheck:
      # 这里的 127.0.0.1 是容器内部探活自己，与上面宿主侧的监听地址是两回事
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

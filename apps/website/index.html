<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17d1a7" />

    <!-- 与语言相关的 head（title / description / canonical / hreflang / og / twitter / JSON-LD）
         全部由 src/App.vue 的 useHead 按语言输出，这里只留与语言无关的静态项。 -->

    <!-- 图标与词标都托管在品牌规范站，首屏就要用：提前把连接建好，省掉一次 DNS + TLS 往返 -->
    <link rel="preconnect" href="https://standards.mintpop.ai" />

    <!-- 浏览器图标：直接引品牌规范站上的 Lane 应用瓦片（Cloud 底、深浅通用，规范里的首选素材）。
         不落地到本仓库：规范站换图，这边跟着变，不用重出尺寸也不会与规范漂移。
         规范站同在 Cloudflare 后面（含中国大陆在内全球可达），不违反可达性要求。 -->
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="https://standards.mintpop.ai/assets/products/lane/lane-app-cloud.png"
    />
    <link rel="apple-touch-icon" href="https://standards.mintpop.ai/assets/products/lane/lane-app-cloud.png" />

    <!-- 社交卡片里与语言无关的部分。
         og:image / twitter:image 不在此列——两种语言各有一张排版好的卡片图，
         已挪进 src/App.vue 的 useHead 按语言输出。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MintPop Lane" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

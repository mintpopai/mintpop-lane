# 官网容器内 Nginx 站点配置（落在 /etc/nginx/conf.d/default.conf）。
# 容器只监听 80 明文 HTTP；HTTPS 由前置反向代理或 Cloudflare 负责。
# 官网是主站域名（lane.mintpop.ai），桌面端 app 的 API 与登录流都打这个域名，
# 故本站点也要把 /api、/auth、/oauth2 反代到 server（compose 内网服务名）。

# TLS 在外层（Cloudflare/宿主反代）终止：已带 X-Forwarded-Proto 则透传，否则取本机 scheme
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# GitHub API 反代缓存区（http context——本文件被 nginx.conf 的 http{} include，故可在 server 外写指令）。
# 把 releases 列表缓存几分钟，将真正打到 api.github.com 的请求压到远低于 60 次/小时的未认证限流。
proxy_cache_path /var/cache/nginx/gh levels=1:2 keys_zone=gh:1m max_size=16m inactive=1h use_temp_path=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    # 两个 JS 的 MIME 都列上：较新版本的 nginx 把 .js 的默认类型改成了 text/javascript
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 下载页数据源：反代 GitHub REST 的 releases 列表（同源——避开浏览器对 api.github.com 的跨域；
    # 缓存——抹平 60/h 未认证限流）。前端从列表里过滤出最新 v* 正式版及其 dmg/exe 真实直链。
    location = /api/gh/releases {
        # proxy_pass 带变量才会用 resolver 做「运行时」DNS 解析（GitHub 的 IP 常变，避免启动时解析过期后 502）
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $gh_api api.github.com;
        proxy_ssl_server_name on;
        # per_page=10：releases 接口默认每页 30 条，这里收窄响应体（版本再多也固定上限）
        proxy_pass https://$gh_api/repos/mintpopai/mintpop-lane-desktop/releases?per_page=10;
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent mintpop-lane-website;    # GitHub API 强制要求 UA，缺了会 403
        proxy_set_header Accept application/vnd.github+json;

        # 上游 GitHub 自带 Cache-Control（max-age=60）：① nginx 缓存时长优先级是「上游头 > proxy_cache_valid」，
        # 不忽略它 5m 缓存实际只有 60s；② 原样透传会与下面 add_header 叠成两条冲突的 Cache-Control。
        # 故缓存决策忽略之、对客户端隐藏之，缓存时长与客户端缓存头都以本文件为准。
        proxy_ignore_headers Cache-Control Expires;
        proxy_hide_header Cache-Control;

        proxy_cache gh;
        proxy_cache_valid 200 5m;                            # 命中期内零上游请求；过期才回源一次
        proxy_cache_lock on;                                 # 过期瞬间并发只放一个回源，其余等它
        # 上游异常（含 403 限流）时返回上一次的旧缓存，下载数据永不因限流断供
        proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        add_header Cache-Control public,max-age=300;
        add_header X-Cache-Status $upstream_cache_status;    # HIT/MISS/STALE，便于排查缓存是否生效
    }

    # 桌面端 app 的服务端接口（/api/link/**、/api/auth/desktop/exchange、/api/me 等）。
    # 上面 /api/gh/releases 是精确匹配（=），优先级高于本前缀匹配，互不影响。
    # 不带路径的 proxy_pass 会原样保留 URI，服务端拿到的仍是 /api/link/config
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # 桌面登录流：/auth/desktop/start 发起、/auth/callback 回跳都在服务端
    location /auth/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # Spring Security OAuth2 授权发起端点（/oauth2/authorization/logto）
    location /oauth2/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # 带 hash 的静态资源长缓存（^~：优先于下方正则匹配，hash 资源永远走这里的 immutable）
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control public,immutable;
    }

    # index.html 不缓存，保证发版即时可见
    location = /index.html {
        add_header Cache-Control no-cache;
    }

    # public/ 下不带 hash 的图（favicon 等）：短缓存，同名覆盖时不至于旧图长期残留
    location ~ \.(png|jpg|jpeg|webp|svg|ico)$ {
        add_header Cache-Control public,max-age=300;
    }

    # 静态文件直出；未知路径返回 404——本站只有一条路由、无客户端专属路由，
    # 若回退 index.html 会让任意路径都 200（爬虫眼里的软 404，伤 SEO）
    location / {
        try_files $uri $uri/ =404;
    }
}

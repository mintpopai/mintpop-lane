server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 运行时配置由 compose 以只读卷挂进来，必须每次都取最新，绝不能被缓存
    location = /config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # index.html 不缓存：发新版后若还拿旧的 index，引用的就是已经不存在的 assets
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # 构建产物带内容哈希，可以长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA history fallback：/users、/nodes、/callback 这些是前端路由，
    # 直接刷新或从 Logto 跳回来时服务器上并没有对应文件，一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

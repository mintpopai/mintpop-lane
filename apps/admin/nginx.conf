server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头。注意 nginx 的 add_header 不跨层继承：下面三个 location 各自已经写了
    # add_header（设置 Cache-Control），一旦某 location 内出现 add_header，server 层的
    # 全部 add_header 对它就会失效，所以这三行必须在那三处各重复一份，不是冗余
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # 运行时配置由 compose 以只读卷挂进来，必须每次都取最新，绝不能被缓存
    location = /config.json {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # index.html 不缓存：发新版后若还拿旧的 index，引用的就是已经不存在的 assets
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # 构建产物带内容哈希，可以长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # SPA history fallback：/users、/nodes 这些是前端路由，
    # 直接刷新或从服务端登录回跳时服务器上并没有对应文件，一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    # 两个 JS 的 MIME 都列上：较新版本的 nginx 把 .js 的默认类型从 application/javascript
    # 改成了 text/javascript，只列一个会让主包整份不压缩地发出去
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# 管理端站点：静态资源 + 反代 /api、/auth、/oauth2 到 server（compose 内网服务名）
# 对外入口是宿主机 OpenResty（按 Host 分流到本站点端口）；本容器端口只绑回环，不直接对公网暴露
# TLS 在外层（Cloudflare/宿主 OpenResty）终止：已带 X-Forwarded-Proto 则透传，否则取本机 scheme
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头。注意 nginx 的 add_header 不跨层继承：下面两个 location 各自已经写了
    # add_header（设置 Cache-Control），一旦某 location 内出现 add_header，server 层的
    # 全部 add_header 对它就会失效，所以这三行必须在那两处各重复一份，不是冗余
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # index.html 不缓存：发新版后若还拿旧的 index，引用的就是已经不存在的 assets
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # 构建产物带内容哈希，可以长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # SPA history fallback：/users、/nodes 这些是前端路由，
    # 直接刷新或从服务端登录回跳时服务器上并没有对应文件，一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 服务端要转发的不只是 /api：登录握手（/auth/**）与 OAuth2 授权发起（/oauth2/**）也在服务端。
    # 不带路径的 proxy_pass 会原样保留 URI，服务端拿到的仍是 /api/admin/users、/auth/callback
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location /auth/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # Spring Security OAuth2 授权发起端点（/oauth2/authorization/logto），与 vite 开发代理保持对称
    location /oauth2/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    gzip on;
    # 两个 JS 的 MIME 都列上：较新版本的 nginx 把 .js 的默认类型从 application/javascript
    # 改成了 text/javascript，只列一个会让主包整份不压缩地发出去
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

spring:
  application:
    name: lane-server
  flyway:
    # 迁移脚本在 classpath:db/migration，启动时自动执行
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      # 与 ImageUploadService.MAX_BYTES、管理端 ImageUploadButton 的本地预检三处一致
      max-file-size: 5MB
      # 比单文件上限略大，留给 multipart 的分隔符与表单字段开销
      max-request-size: 6MB

mybatis-plus:
  configuration:
    # 列名 snake_case 自动映射到实体的 camelCase 字段
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

server:
  port: 8080
  # 不设 address：容器内必须绑 0.0.0.0（容器网络本身是边界，
  # 不对外由 compose 的宿主端口只绑 127.0.0.1 保证）。
  # 本地开发时在 config/application.yml 里绑回环。
  # 反代终结 TLS，按 X-Forwarded-* 还原 https，否则会话 Cookie 的 Secure 不生效；
  # 本地无此头等于无操作。
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    ai.mintpop.lane: INFO

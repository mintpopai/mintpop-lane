lane:
  link:
    # 特意与 LinkProperties.ttlSeconds 的默认值（1800）不同：若把配置绑定删掉，
    # 字段会回落到默认值，测试断言必须能因此变红，才守得住「配置真的生效」
    ttl-seconds: 900
  crypto:
    # 测试专用固定密钥（32 字节的 Base64），只用于测试，不是任何环境的真实密钥
    key: "bWludHBvcC10ZXN0LWtleS0wMTIzNDU2Nzg5YWJjZCE="
  auth:
    # 测试专用固定密钥，32 字节，不是任何环境的真实密钥
    session-secret: "lane-test-session-secret-0123456789ab"
spring:
  security:
    oauth2:
      client:
        registration:
          logto:
            client-id: "test-client-id"
            client-secret: "test-client-secret"
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/auth/callback"
            scope: openid,profile,email
        provider:
          logto:
            authorization-uri: "http://127.0.0.1:9/oidc/auth"
            token-uri: "http://127.0.0.1:9/oidc/token"
            jwk-set-uri: "http://127.0.0.1:9/oidc/jwks"
            user-name-attribute: sub

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # 用 jwk-set-uri 而非 issuer-uri：后者会在应用启动时拉 OIDC discovery，
          # 让测试依赖外网。jwk-set-uri 是懒加载，而 MockMvc 的 jwt() 后处理器
          # 直接注入认证对象、不走真实解码，因此这个地址永远不会被真的请求。
          jwk-set-uri: "http://127.0.0.1:9/jwks"

mintpop:
  link:
    ttl-seconds: 1800
  crypto:
    # 测试专用固定密钥（32 字节的 Base64），只用于测试，不是任何环境的真实密钥
    key: "bWludHBvcC10ZXN0LWtleS0wMTIzNDU2Nzg5YWJjZCE="

lane:
  link:
    # 特意与 LinkProperties.ttlSeconds 的默认值（1800）不同：若把配置绑定删掉，
    # 字段会回落到默认值，测试断言必须能因此变红，才守得住「配置真的生效」
    ttl-seconds: 900
  crypto:
    # 测试专用固定密钥（32 字节的 Base64），只用于测试，不是任何环境的真实密钥
    key: "bWludHBvcC10ZXN0LWtleS0wMTIzNDU2Nzg5YWJjZCE="
  auth:
    # 测试专用固定密钥，32 字节，不是任何环境的真实密钥
    session-secret: "lane-test-session-secret-0123456789ab"
# 特意与 IpAsnCacheProperties 的默认值（24h / 5000）不同，同上「配置真的生效」的道理——
# 见 DnsConfigIpAsnClientWiringTest
ip-asn-cache:
  ttl: 2h
  max-entries: 123
link-report:
  # 特意与 LinkReportProperties.alertDedupTtl 的默认值（24h）不同——见 LinkReportPropertiesTest。
  # 本仓 LinkReportAlertServiceTest 等用例一律 `new LinkReportProperties()` 手工构造、不走
  # Spring 绑定，改这个值不会影响它们
  alert-dedup-ttl: 36h
client-version:
  # 测试不许联网拉真实更新清单：指向必定拒连的本机端口，拉取失败只记日志、最新版保持未知。
  # 要测「已知最新版」的用例自己 mock LatestClientVersionClient
  manifest-url: "http://127.0.0.1:9/latest.json"
spring:
  security:
    oauth2:
      client:
        registration:
          logto:
            client-id: "test-client-id"
            client-secret: "test-client-secret"
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/auth/callback"
            scope: openid,email
        provider:
          logto:
            authorization-uri: "http://127.0.0.1:9/oidc/auth"
            token-uri: "http://127.0.0.1:9/oidc/token"
            jwk-set-uri: "http://127.0.0.1:9/oidc/jwks"
            user-name-attribute: sub

# 服务端配置模板。复制为同目录 application.yml 并填入真实值。
# config/application.yml 已被 .gitignore 排除，且位于 src/main/resources 之外，不会被打进 jar 或镜像。
# 该文件含数据库口令与加密密钥，严禁入库。
#
# 本地开发：mise run run-server 的工作目录是 apps/server，Spring Boot 启动时自动读取 ./config/application.yml。
# 线上部署：复制到部署机的仓库根（docker-compose.yml 旁）改名 application.yml，由 compose 以只读卷挂到容器 /app/config/，见根 README.md。

# 本地开发解开下面三行：只绑回环，并把端口固定为 6200（本项目本地占 6200 段：server 6200、admin 6201、
# website 6202、console 6203，被占用即启动失败、不会自己换端口，前端代理与桌面端默认地址都指向它）。
# 线上（容器内）必须保持注释——容器要绑 0.0.0.0、监听默认的 8080（各前端 nginx 反代的是 server:8080），
# 不对外由 compose 的宿主端口只绑 127.0.0.1 保证。
# server:
#   address: 127.0.0.1
#   port: 6200

spring:
  datasource:
    # 本地开发填本机 MySQL，线上填外置 MySQL。库需提前建好，表由 Flyway 自动建
    url: "jdbc:mysql://127.0.0.1:3306/lane?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true"
    username: 填入数据库用户名
    password: 填入数据库口令
  security:
    oauth2:
      client:
        registration:
          logto:
            # Logto 里「传统 Web 应用」的凭据
            client-id: 填入 Logto 传统 Web 应用的 App ID
            client-secret: 填入 Logto 传统 Web 应用的 App Secret
            redirect-uri: "{baseUrl}/auth/callback"
            scope: openid,email
        provider:
          logto:
            # Logto 租户的 OIDC issuer，形如 https://<tenant>.logto.app/oidc
            issuer-uri: "https://填入你的租户.logto.app/oidc"

lane:
  link:
    # 下发给客户端的配置有效期（秒）
    ttl-seconds: 1800
  auth:
    # 自签会话 token 的 HS256 密钥，至少 32 字节。生成：openssl rand -base64 32
    # 换了这个值，所有已登录会话（含桌面端钥匙串里的）全部失效——也是应急踢下线手段
    session-secret: 填入生成的密钥
  crypto:
    # 32 字节密钥的 Base64。生成：openssl rand -base64 32
    # 换了这个值，库里已有的密文全部解不开，必须重录所有凭据与节点密码
    key: 填入生成的密钥
  front-tuning:
    # 按 mihomo type 分派的下发参数覆盖。表里没有的协议原样透传；
    # 整段留空即恢复现状——出问题时这就是回退开关。
    # ⚠️ 下列数值未经实测：拉长空闲超时理论上可能触发机场的异常长连接限速。
    #    若出现「连接建立后很快被掐」的新症状，先把 idle-session-timeout 调回 30。
    protocols:
      anytls:
        idle-session-check-interval: 30
        idle-session-timeout: 300
        min-idle-session: 1

# —— 落地出口 IP 巡检 ——定时探测启用中的落地节点，实际出口与登记不一致就自动回填库；与是否配置通知无关——
egress-check:
  # 巡检间隔（上一轮结束到下一轮开始），Spring Boot 时长写法；启动后先等这么久再跑首轮。
  # 回填出口 IP 时，出口时区同步按新 IP 重新解析（GeoIP 走 ipwho.is，服务端需能访问它）
  interval: 10m

# —— 订阅定时刷新 ——周期性把各订阅的节点集合整体对齐到机场当前给出的节点（新增/更新/删除），并更新订阅额度——
# 拉取失败（重试后仍失败或当前地区无节点）不动节点，只在订阅上标记失败并每轮推飞书
sub-refresh:
  # 刷新间隔（上一轮结束到下一轮开始），Spring Boot 时长写法；启动后先等这么久再跑首轮
  interval: 5m

# —— ASN 反查缓存 ——每个来源 IP 一天只反查一次，免费服务不被高频心跳打到限流
ip-asn-cache:
  ttl: 24h
  max-entries: 5000

# —— 链路上报（三期可观测性）——客户端按窗口上报第一跳健康状况，服务端反查运营商后落库——
link-report:
  # 成功率跌破这个值就告警。⚠️ 未经生产实测，先按经验取值，有数据后再调
  alert-threshold: 0.80
  # 最小样本量：低于它一律不告警。样本太少时比值没有意义（用户刚上线、或整段窗口离线），
  # 按 0/0 当成 0% 报出去会在最不该吵的时候吵
  alert-min-samples: 20
  # 原始窗口保留天数，超过由归档任务压成按天聚合
  raw-retention-days: 7
  # 按天聚合保留天数
  daily-retention-days: 90
  # 归档扫描周期：定时任务多久跑一次，把超过 raw-retention-days 的原始窗口压成按天聚合，
  # 并顺带清理超过 daily-retention-days 的按天聚合行。⚠️ 未经生产实测，可回退
  archive-interval: 1h
  # 上报窗口起点允许比「现在」落后多久，超过就丢弃整条上报块——避免客户端时钟不准/被构造出
  # 任意时间的窗口污染按天聚合的口径。Spring Boot 时长写法
  window-max-past: 1h
  # 上报窗口起点允许比「现在」超前多久，超过就丢弃整条上报块——未来时间戳会让窗口永远绕开
  # 归档任务的 findWindowsBefore 扫描
  window-max-future: 5m
  # 告警扫描周期：定时任务多久跑一次，与 5 分钟上报窗口对齐。⚠️ 未经生产实测，可回退
  alert-check-interval: 5m
  # 每次告警扫描回看多久的数据。取 3 个上报窗口而不是 1 个：单窗口的样本量在用户少时
  # 过不了 alert-min-samples 的门槛，会让告警永远不触发
  alert-lookback: 15m
  # 去重状态的有效期：已推过的告警超过这么久仍在劣化就再推一次。用户在劣化中离线（最常见：
  # 链路差到断开）后再回来，没有它就永远不会再收到告警。⚠️ 未经生产实测，可回退
  alert-dedup-ttl: 24h

# —— 订单 ——
order:
  # 待支付订单的支付时限（分钟）：超时由读到它的入口懒惰置为已过期，不再受理支付
  expire-minutes: 30

# —— 支付（Stripe）——整段可选：不配 secret-key 与 publishable-key 时控制台的支付入口自动禁用，其它功能不受影响
# 密钥在 Stripe Dashboard → Developers → API keys；webhook 密钥在 Developers → Webhooks 建端点后取得，
# 端点地址 https://<控制台域名>/api/v1/payment/webhook/stripe，只订阅 payment_intent.succeeded 与 payment_intent.payment_failed。
# 本地联调用 mise run webhook-listen（需先安装 Stripe CLI 并 stripe login），
# 打印的 whsec_ 密钥，Dashboard 那把只用于线上。
payment:
  stripe:
    secret-key: 填入 sk_ 开头的 secret key
    publishable-key: 填入 pk_ 开头的 publishable key
    webhook-secret: 填入 whsec_ 开头的 webhook 签名密钥
    # 启用的支付方式（我方命名：card / alipay / wxpay），逗号分隔；收款币种按套餐币种走，不在这里配
    supported-types: card,alipay,wxpay
    # 卡账单描述符后缀，显示为 MINTPOP* LANE；留空则不传
    statement-descriptor-suffix: LANE
    # 业务线标记，写入 PaymentIntent 的 metadata.product；同一 Stripe 账号多业务共用时 webhook 据此只认领本业务事件
    product-code: lane

# —— 通知（飞书群自定义机器人）——整段可选：不配 webhook 则不推送（上面的巡检与自动回填仍照常跑）——
# 目前推送的事件：落地出口 IP 已变更——管理端改了出口 IP（含检测后一键回填）、
# 或定时巡检发现实际出口与登记不一致并自动回填，都在库改完之后推一张卡片
# · 控制台自助购买付款成功——订阅已按套餐建出、等管理员填起期开通，卡片带买家邮箱、套餐、订单号、分配号
# · 用户提了换机申请——卡片带用户、套餐、分配号、原/新设备、理由与申请号，需要管理员去后台裁决
# · 订阅定时刷新发现节点增减——只告知不自动新增/删除，是否处理需人工确认
# · 订阅定时刷新发现节点端点（地址:端口）变化——意味着此前下发给用户的配置已失效，需人工确认
# · 中转入口 IP 巡检发现入口 IP 变更——大概率意味着该入口刚被封过，是封锁事件的间接信号
# 获取方式：飞书群设置 → 群机器人 → 添加「自定义机器人」，安全设置勾选「签名校验」
notify:
  feishu:
    webhook-url: 填机器人webhook地址（https://open.feishu.cn/open-apis/bot/v2/hook/ 开头）
    secret: 填签名校验密钥
    # 管理端地址，如 https://admin.lane.mintpop.ai；用于在换机申请卡片末尾给出处理入口，留空则省略该行
    admin-url: 填管理端地址

claude:
  oauth:
    # 以下均为 Claude OAuth 端点常量，非密钥，各环境一致，取自 Claude Code CLI 2.1.246 的 prod 配置块
    client-id: 9d1c250a-e61b-44d9-88ed-5944d1962f5e
    authorize-url: https://claude.com/cai/oauth/authorize
    token-url: https://platform.claude.com/v1/oauth/token
    revoke-url: https://platform.claude.com/v1/oauth/token/revoke
    redirect-uri: https://platform.claude.com/oauth/code/callback
    # 最小充分集，不可增删：多要 user:mcp_servers 会被拒发长有效期，少要 user:profile 则方案目的落空
    scope: "user:profile user:inference"
    max-expires-in-seconds: 31536000

# 套餐图上传用的 Cloudflare R2 对象存储。
# 整段可选：五项留空则上传接口返回「图片存储未配置」（业务码 410044），
# 管理端手填图片地址那条路照常可用，其它功能完全不受影响，本地开发不必配。
# 桶名与自定义域见 docs/superpowers/specs/2026-09-16-套餐商品化-design.md。
storage:
  r2:
    # Cloudflare 账户 ID，用于拼 S3 兼容端点 https://<accountId>.r2.cloudflarestorage.com
    account-id: ""
    # R2 API Token 生成的 Access Key ID（敏感）
    access-key-id: ""
    # R2 API Token 生成的 Secret Access Key（敏感）
    secret-access-key: ""
    bucket: mintpop-lane-assets
    # 桶绑定的自定义域名，图片的公开地址由它 + 对象键拼成
    public-base-url: https://assets.lane.mintpop.ai

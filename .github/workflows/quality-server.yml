# 复用型质量门禁（workflow_call）：CI 与发版 workflow 共用，改一处两边生效
name: Quality Server

on:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 mise 工具链
        uses: jdx/mise-action@v4
        with:
          install_args: java maven
      - name: 运行服务端单元测试
        run: mise run test-server

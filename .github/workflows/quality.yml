name: Quality

on:
  workflow_call:

jobs:
  desktop:
    name: 桌面端质量门禁
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装工具链
        uses: jdx/mise-action@v4

      - name: 安装前端依赖
        run: mise run install-desktop --frozen

      - name: 检查 Rust 代码
        run: mise run lint-desktop

      - name: 跑 Rust 测试
        run: mise run test-desktop

  server:
    name: 服务端质量门禁
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装工具链
        uses: jdx/mise-action@v4

      - name: 跑服务端测试
        run: mise run test-server

  admin:
    name: 管理端质量门禁
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装工具链
        uses: jdx/mise-action@v4

      - name: 安装前端依赖
        run: mise run install-admin --frozen

      - name: 检查代码风格与类型
        run: mise run lint-admin

      - name: 跑单元测试
        run: mise run test-admin

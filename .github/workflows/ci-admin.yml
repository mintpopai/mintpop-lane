name: CI Admin

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "mise.toml"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci-admin.yml"
      - ".github/workflows/quality-admin.yml"
  pull_request:
    paths:
      - "apps/admin/**"
      - "mise.toml"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci-admin.yml"
      - ".github/workflows/quality-admin.yml"

jobs:
  quality:
    uses: ./.github/workflows/quality-admin.yml

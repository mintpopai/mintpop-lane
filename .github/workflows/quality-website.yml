# 复用型质量门禁（workflow_call）：CI 与发版 workflow 共用，改一处两边生效
name: Quality Website

on:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 mise 工具链
        uses: jdx/mise-action@v4
        with:
          install_args: node pnpm
      - name: 安装前端依赖（按 lockfile 精确安装）
        run: mise run install-website --frozen
      - name: 检查代码风格、格式与类型
        run: mise run lint-website
      - name: 运行官网单元测试
        run: mise run test-website
      - name: 构建官网静态产物（校验预渲染层）
        run: mise run build-website
      - name: 校验预渲染产物（locale 串台 / head 重复 / 空壳，均不报错的失败模式）
        run: |
          set -euo pipefail
          DIST=apps/website/dist
          fail=0

          # 英文标题片段来自 copy.ts 的 en.meta.title；改标题时同步改这里
          EN_TITLE="Stable, official Claude Code access"

          if ! grep -q "$EN_TITLE" "$DIST/en/index.html"; then
            echo "断言失败：$DIST/en/index.html 未含英文标题 '$EN_TITLE'（英文页可能被渲染成中文/空壳）"
            fail=1
          fi

          if grep -q "$EN_TITLE" "$DIST/index.html"; then
            echo "断言失败：$DIST/index.html（中文页）含英文标题 '$EN_TITLE'（locale 在并发预渲染中串台）"
            fail=1
          fi

          # 每份预渲染 HTML 恰好一个 <title>（head 被重复叠加时会变成 2 个），且英文页 lang="en"、中文页 lang="zh-CN"
          pages=$(find "$DIST" -name index.html | sort)
          count=$(printf '%s\n' "$pages" | wc -l | tr -d ' ')
          if [ "$count" -lt 10 ]; then
            echo "断言失败：只找到 $count 份 index.html，应至少 10 份（首页 2 + 指南 4×2）"
            fail=1
          fi
          for f in $pages; do
            n=$(grep -o '<title>' "$f" | wc -l | tr -d ' ')
            if [ "$n" != "1" ]; then
              echo "断言失败：$f 的 <title> 出现 $n 次，应为 1 次"
              fail=1
            fi
            case "$f" in
              "$DIST"/en/*) want='lang="en"' ;;
              *)            want='lang="zh-CN"' ;;
            esac
            if ! grep -q "$want" "$f"; then
              echo "断言失败：$f 未含 $want（语言与路径不符）"
              fail=1
            fi
          done

          exit $fail

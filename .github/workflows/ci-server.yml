name: CI Server

on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "mise.toml"
      - ".github/workflows/ci-server.yml"
      - ".github/workflows/quality-server.yml"
  pull_request:
    paths:
      - "apps/server/**"
      - "mise.toml"
      - ".github/workflows/ci-server.yml"
      - ".github/workflows/quality-server.yml"

jobs:
  quality:
    uses: ./.github/workflows/quality-server.yml

name: Release Desktop

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  quality:
    name: 发版前质量门禁
    uses: ./.github/workflows/quality.yml

  release-notes:
    name: 建立 GitHub Release
    needs: quality
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          # COMMIT 模式的变更日志需要全量历史
          fetch-depth: 0

      - name: 解析上一版同前缀 tag
        id: prev
        env:
          TAG: ${{ github.ref_name }}
        run: |
          prev="$(git tag -l 'desktop-v*' --sort=-v:refname \
            | awk -v cur="$TAG" 'f { print; exit } $0 == cur { f = 1 }')"
          if [ -z "$prev" ]; then
            # 首发：无上一版，起点取初始提交 = 全量历史
            prev="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          echo "from=$prev" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#desktop-v}" >> "$GITHUB_OUTPUT"

      - name: 生成变更日志
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          fromTag: ${{ steps.prev.outputs.from }}
          toTag: ${{ github.ref_name }}
          configurationJson: |
            {
              "mode": "COMMIT",
              "template": "#{{CHANGELOG}}",
              "label_extractor": [
                {
                  "pattern": "^(feat|fix|perf|refactor|revert|build|chore|ci|docs|style|test)[^:]*:.*",
                  "target": "$1",
                  "on_property": "title",
                  "method": "replace"
                }
              ],
              "categories": [
                { "title": "### 新功能", "labels": ["feat"] },
                { "title": "### 问题修复", "labels": ["fix"] },
                { "title": "### 性能优化", "labels": ["perf"] },
                { "title": "### 重构", "labels": ["refactor"] },
                { "title": "### 回滚", "labels": ["revert"] }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 组装 Release 正文
        env:
          TAG: ${{ github.ref_name }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          : > notes.md
          if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
            git tag -l --format='%(contents)' "$TAG" >> notes.md
            printf '\n\n' >> notes.md
          fi
          printf '%s\n' "$CHANGELOG" >> notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "- 本次无面向用户的变更" > notes.md
          fi

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: MintPop Lane desktop v${{ steps.prev.outputs.version }}
          body_path: notes.md

  bundle:
    name: 出包 (${{ matrix.label }})
    # 让正文先建好：本 job 只上传制品、不设 body，不会清空已有正文
    needs: release-notes
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 只出 Apple 芯片与 Windows x64；不支持 Intel Mac
          - os: macos-14
            label: macOS arm64
          - os: windows-latest
            label: Windows x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装工具链
        uses: jdx/mise-action@v4

      - name: 安装前端依赖
        run: mise run install-desktop --frozen

      - name: 下载 mihomo 内核
        shell: bash
        run: mise run fetch-mihomo

      - name: 构建安装包
        env:
          # Logto 的 issuer/client_id/api_resource 由服务端下发，不再编译进包
          LANE_SERVER_URL: ${{ vars.LANE_SERVER_URL }}
        run: mise run build-desktop

      - name: 上传制品到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
